name: Bug report
description: Report a reproducible offline engine, fixture, or documentation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real credentials, victim data, or active indicators.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include safe commands, fixture IDs, and output with sensitive values removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python and operating system
    validations:
      required: true
