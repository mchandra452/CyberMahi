name: Sentinel SOC lab CI

on:
  push:
    branches: [main]
    paths:
      - "sentinel-soc-investigation-lab/**"
      - ".github/workflows/sentinel-soclab-ci.yml"
  pull_request:
    paths:
      - "sentinel-soc-investigation-lab/**"
      - ".github/workflows/sentinel-soclab-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-soc-investigation-lab
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sentinel-soc-investigation-lab/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=soclab --cov-report=term-missing
      - name: Validate repository
        run: python -m soclab validate
      - name: Analyze and test detections
        run: |
          python -m soclab analyze
          python -m soclab test-detections
          python -m soclab build-report
      - name: Verify deterministic committed evidence
        run: diff -ru artifacts/example artifacts/latest
